<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- jeito de app no celular: sem zoom de pinça na tela (as fotos têm zoom próprio; o tamanho do texto fica em Meu perfil)
         e o teclado encolhe a tela em vez de cobrir o botão de baixo. No PC o zoom do navegador (Ctrl +) continua. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#00658C" />
    <!-- tema escuro e tamanho do texto antes da primeira pintura (sem piscar). Mesma regra de src/lib/tema.ts e src/lib/tamanhoTexto.ts -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("dinodesk:tema");
          var escuro = t === "escuro" || (t !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) {
            document.documentElement.classList.add("dark");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
          }
          var tx = localStorage.getItem("dinodesk:texto");
          if (tx === "grande" || tx === "maior") document.documentElement.dataset.texto = tx;
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Dino Desk: abertura e acompanhamento de chamados do Departamento de TI da Prefeitura de Tijucas" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icone.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Dino Desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
