<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00658C" />
    <!-- tema escuro antes da primeira pintura (sem piscar branco). Mesma regra de src/lib/tema.ts -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("dinodesk:tema");
          var escuro = t === "escuro" || (t !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) {
            document.documentElement.classList.add("dark");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0c1613");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Dino Desk: abertura e acompanhamento de chamados do Departamento de TI da Prefeitura de Tijucas" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icone.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Dino Desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
